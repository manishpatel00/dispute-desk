<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispute Desk — billing investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--muted:#5b6678;--line:#d5dbe3;--bad:#b3261e;--ok:#1b6b4a;--warn:#8a5a00;--accent:#1f4fd8;--stale:#6b4fa3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--panel:#171f2e;--ink:#e8edf6;--muted:#9aa6bb;--line:#2a3548;--bad:#ff8a80;--ok:#6fd1a2;--warn:#f0c36b;--accent:#8fb0ff;--stale:#c0a8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font:700 26px "Source Serif 4",Georgia,serif;margin:0}h2{font:700 18px "Source Serif 4",Georgia,serif;margin:0 0 10px}
main{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px 28px;max-width:1280px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
button{font:inherit;padding:7px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,li:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);width:100%}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:13px}.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line);margin-right:4px}
.stale{color:var(--stale);border-color:var(--stale)}.calc{color:var(--bad);border-color:var(--bad)}.amb{color:var(--warn);border-color:var(--warn)}
ul.cases{list-style:none;margin:0;padding:0}ul.cases li{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}ul.cases li[aria-current=true]{background:var(--bg);font-weight:700}
.finding{border-left:4px solid var(--line);padding:6px 12px;margin:10px 0}.finding.calculation_error{border-color:var(--bad)}.finding.contract_ambiguity{border-color:var(--warn)}.finding.stale{opacity:.7}
.cite{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#msg{position:sticky;top:0;padding:10px 16px;margin:0 0 12px;border-radius:4px;display:none}#msg.err{display:block;background:var(--bad);color:#fff}#msg.good{display:block;background:var(--ok);color:#fff}
.muted{color:var(--muted)}pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<header><h1>Dispute Desk</h1><span class="muted">Deterministic recalculation · AI interpretation · human approval</span></header>
<main>
<aside><div class="panel"><h2>Cases</h2><div class="row"><button id="load">Load sample case</button></div><ul class="cases" id="cases" role="list"></ul><p id="emptyCases" class="muted">No cases yet. Load the sample to begin.</p></div></aside>
<section><div id="msg" role="status" aria-live="polite"></div><div id="detail"><div class="panel muted">Select or create a case.</div></div></section>
</main>
<script>
const $=s=>document.querySelector(s);let cur=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(t,ok){const m=$("#msg");m.className=ok?"good":"err";m.textContent=t;if(ok)setTimeout(()=>m.className="",3500)}
async function api(p,o={}){const r=await fetch("/api"+p,{headers:{"Content-Type":"application/json"},...o,body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"Request failed ("+r.status+")");return j}
async function guard(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){say(e.message)}finally{if(btn)btn.disabled=false}}
async function loadCases(){const cs=await api("/cases");$("#emptyCases").hidden=cs.length>0;
 $("#cases").innerHTML=cs.map(c=>`<li tabindex="0" data-id="${esc(c.id)}" ${c.id===cur?'aria-current="true"':""}>${esc(c.id)}<br><span class="muted">${esc(c.customer)} · ${esc(c.status)}</span></li>`).join("");
 document.querySelectorAll("#cases li").forEach(li=>{li.onclick=()=>open(li.dataset.id);li.onkeydown=e=>{if(e.key==="Enter")open(li.dataset.id)}})}
$("#load").onclick=e=>guard(e.target,async()=>{const p=await api("/sample");const r=await api("/cases",{method:"POST",body:{payload:p}});await loadCases();await open(r.id);say("Sample case created",1)});
async function open(id){cur=id;await loadCases();const d=await api("/cases/"+id);render(d)}
function render(d){const c=d.calculation||d.calc,L=c?c.lines:[],f=d.findings;
 const cmp=c?`<table><tr><th>Line</th><th>Billed qty</th><th>Valid qty</th><th>Billed</th><th>Recalculated</th><th>Δ</th></tr>${L.map(l=>`<tr><td>${esc(l.line_id)} ${esc(l.metric)} ${l.flags.map(x=>`<span class="tag ${["AMBIGUOUS_RULE","MISSING_USAGE","CALC_ERROR"].includes(x)?"amb":"calc"}">${esc(x)}</span>`).join("")}</td><td>${esc(l.billed_qty)}</td><td>${esc(l.correct_qty)}</td><td>${esc(l.billed_amount)}</td><td>${esc(l.correct_amount)}</td><td class="${+l.delta?"bad":"ok"}">${esc(l.delta)}</td></tr>`).join("")}
 <tr><th>Total</th><th></th><th></th><th>${esc(c.original_total)}</th><th>${esc(c.recalculated_total)}</th><th>${esc(c.overbilled)}</th></tr></table><p class="muted">Calculated by deterministic code from evidence v${c.evidence_version}. Already credited: ${esc(c.already_credited)} · ${+c.unresolved_ambiguous?`<span class="tag amb">held for contract interpretation: ${esc(c.unresolved_ambiguous)}</span> `:""}Credited in app: ${esc(c.credited_in_app)} · Creditable now: <b>${esc(c.creditable_now)}</b>${c.partial?' · <span class="tag amb">partial result: '+c.errors.map(esc).join(", ")+' failed</span>':""}</p>`:`<p class="muted">Not investigated yet.</p>`;
 $("#detail").innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">${esc(d.case.id)} — ${esc(d.case.customer)}</h2><span class="tag">${esc(d.case.status)}</span>${d.calc_stale?'<span class="tag stale">calculation stale — re-run</span>':""}</div>
 <p>${esc(d.current.payload.dispute_text)}</p><div class="row"><button id="inv">${c?"Re-run investigation":"Investigate"}</button><span class="muted">Evidence v${d.current.version}</span></div></div>
 <div class="panel"><h2>Original vs recalculated invoice</h2>${cmp}</div>
 <div class="panel"><h2>Findings</h2>${f.length?f.map(x=>`<div class="finding ${esc(x.kind)} ${x.stale?"stale":""}"><span class="tag ${x.kind==="calculation_error"?"calc":x.kind==="contract_ambiguity"?"amb":""}">${esc(x.kind.replace("_"," "))}</span><span class="tag">${esc(x.source)}</span><span class="tag">${esc(x.status)}</span>${x.stale?'<span class="tag stale">stale: evidence changed since v'+x.evidence_version+'</span>':""}
 <div>${esc(x.statement)}</div><div class="cite">Cites: ${x.citations.map(esc).join(", ")}</div>
 <div class="row" style="margin-top:6px"><button class="ghost" data-a="accepted" data-f="${esc(x.id)}">Accept</button><button class="ghost" data-a="edited" data-f="${esc(x.id)}" data-s="${esc(x.statement)}">Edit</button><button class="ghost" data-a="rejected" data-f="${esc(x.id)}">Reject</button></div></div>`).join(""):'<p class="muted">No findings yet. Run the investigation.</p>'}</div>
 <div class="panel"><h2>Resolution (mock credit)</h2><div class="row"><input id="amt" style="width:140px" aria-label="Credit amount" value="${c?esc(c.creditable_now):"0.00"}"><input id="why" placeholder="Reason (required)" aria-label="Reason" style="flex:1"><button id="credit">Approve credit</button><button class="ghost" id="ask">Request info</button></div><p class="muted">Duplicate submissions are ignored; credits above recalculated overbilling are blocked.</p>
 ${d.adjustments.map(a=>`<div class="ok">${esc(a.id)}: ${esc(a.amount)} (evidence v${a.evidence_version})${a.stale?' <span class="tag stale">approved on earlier evidence</span>':""}</div>`).join("")}</div>
 <div class="panel"><h2>Add evidence (reopens case)</h2><textarea id="patch" rows="4" aria-label="Evidence JSON" placeholder='{"usage":[{"id":"U9","metric":"api_calls","quantity":"1000","date":"2026-09-12"}]}'></textarea><div class="row" style="margin-top:6px"><input id="note" placeholder="Note (e.g. customer usage export)" style="flex:1"><button id="addev">Add evidence</button></div></div>
 <div class="panel"><h2>History</h2>${d.decisions.map(x=>`<div class="muted">${new Date(x.created_at*1000).toLocaleString()} · ${esc(x.actor)} · ${esc(x.action)} ${esc(x.detail==="{}"?"":x.detail)}</div>`).join("")}</div>`;
 $("#inv").onclick=e=>guard(e.target,async()=>{const r=await api(`/cases/${cur}/investigate`,{method:"POST"});say(r.ok?`Investigation complete (${r.llm_used?"AI":"rule-based"} interpretation${r.llm_error?" — AI unavailable: "+r.llm_error:""})`:"Calculation failed: "+r.error,r.ok);await open(cur)});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>guard(b,async()=>{let s;if(b.dataset.a==="edited"){s=prompt("Edit finding",b.dataset.s);if(!s)return}await api(`/cases/${cur}/findings/${b.dataset.f}`,{method:"POST",body:{status:b.dataset.a,statement:s}});await open(cur)}));
 $("#credit").onclick=e=>guard(e.target,async()=>{const key=sessionStorage.getItem("k"+cur+$("#amt").value)||("ui-"+crypto.randomUUID());sessionStorage.setItem("k"+cur+$("#amt").value,key);
  const r=await api(`/cases/${cur}/credit`,{method:"POST",body:{amount:$("#amt").value,reason:$("#why").value,idempotency_key:key}});say(r.status==="approved"?"Credit approved (mock)":"Duplicate ignored — already applied",1);await open(cur)});
 $("#ask").onclick=e=>guard(e.target,async()=>{const q=prompt("What do you need from the customer?");if(!q)return;await api(`/cases/${cur}/request-info`,{method:"POST",body:{question:q}});say("Information request recorded",1);await open(cur)});
 $("#addev").onclick=e=>guard(e.target,async()=>{let p;try{p=JSON.parse($("#patch").value)}catch{throw new Error("Evidence must be valid JSON")}await api(`/cases/${cur}/evidence`,{method:"POST",body:{patch:p,note:$("#note").value}});say("Evidence added — earlier conclusions are now marked stale",1);await open(cur)})}
loadCases().catch(e=>say(e.message));
</script></body></html>
